name: Validate and Build Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform wrapper
        run: flutter create --platforms=android --org com.aizahid --project-name auto_mv_cable_tx_sizing_pro .

      - name: Configure app identity
        run: python tool/configure_platforms.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Verify validator has no third-party Python imports
        run: python -m py_compile tool/validate_project.py

      - name: Static controlled-data validation
        run: python tool/validate_project.py

      - name: Apply deterministic Dart formatting
        run: dart format lib test

      - name: Verify formatting is idempotent
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

      - name: Build release APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols/android

      - name: Build release AAB
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols/android

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Auto-MV-Cable-TX-Sizing-Pro-Rev2-Android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/symbols/android
          if-no-files-found: error
