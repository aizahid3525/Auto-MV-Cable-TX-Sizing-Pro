name: Validate and Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Configure Git line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows platform wrapper
        run: flutter create --platforms=windows --org com.aizahid --project-name auto_mv_cable_tx_sizing_pro .

      - name: Configure app identity
        run: python tool/configure_platforms.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify validator has no third-party Python imports
        run: python -m py_compile tool/validate_project.py

      - name: Static controlled-data validation
        run: python tool/validate_project.py

      - name: Apply deterministic Dart formatting
        run: dart format lib test

      - name: Verify formatting is idempotent
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

      - name: Build Windows release
        run: flutter build windows --release --obfuscate --split-debug-info=build/symbols/windows

      - name: Package portable Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/Auto_MV_Cable_TX_Sizing_Pro_Windows_Portable.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auto-MV-Cable-TX-Sizing-Pro-Rev3-Windows
          path: |
            build/Auto_MV_Cable_TX_Sizing_Pro_Windows_Portable.zip
            build/symbols/windows
          if-no-files-found: error
